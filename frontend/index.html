<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Serverless Board</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Serverless Board</h1>
    <div id="user-area" hidden>
      <span id="user-label"></span>
      <button id="logout-button" type="button">Log out</button>
    </div>
  </header>

  <p id="message" role="status"></p>

  <main>
    <section id="auth-section">
      <h2>Log in</h2>
      <form id="login-form">
        <input id="login-email" type="email" placeholder="Email" required>
        <input id="login-password" type="password" placeholder="Password" required>
        <button type="submit">Log in</button>
      </form>

      <h2>Sign up</h2>
      <form id="signup-form">
        <input id="signup-nickanme" type="text" placeholder="Nickname (2-20 characters)"
        minlength="2" maxlength="20" required>
        <input id="signup-email" type="email" placeholder="Email" required>
        <input id="signup-password" type="password" placeholder="Password" required>
        <button type="submit">Sign up</button>
      </form>

      <form id="confirm-form" hidden>
        <p>Enter the confirmation code sent to your email.</p>
        <input id="confirm-code" type="text" placeholder="Confirmation code" required>
        <button type="submit">Confirm</button>
        <button id="resend-button" type="button">Resend code</button>
      </form>
    </section>

    <section id="new-post-section" hidden>
      <h2>New post</h2>
      <form id="post-form">
        <input id="post-title" type="text" placeholder="Title" maxlength="100" required>
        <textarea id="post-content" placeholder="Content" required></textarea>
        <input id="post-images" type="file" accept="image/jpeg,image/png" multiple>
        <p id="preview-hint" class="hint" hidden>Click an image to choose the thumbnail</p>
        <div id="image-previews"></div>
        <div id="insert-buttons"></div>
        <button type="submit">Post</button>
      </form>
    </section>

    <section>
      <h2>Posts</h2>
      <ul id="post-list"></ul>
    </section>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
